<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>场地客服知识库</title>
<style>
  :root{
    --bg:#f5f6f8; --panel:#ffffff; --panel-2:#fafbfc;
    --line:#e5e8ec; --line-2:#eef0f3;
    --tx:#1b1f24; --tx-2:#4b5563; --tx-3:#8b94a1;
    --acc:#2563eb; --acc-soft:#eef3ff;
    --mark:#fff2b8; --warn:#b45309;
    --shadow:0 1px 2px rgba(16,24,40,.04), 0 8px 24px rgba(16,24,40,.06);
    --r:10px;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",system-ui,-apple-system,"Segoe UI",sans-serif;
    background:var(--bg); color:var(--tx); font-size:14px; line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
  input,select{font-family:inherit;font-size:14px;color:inherit}
  mark{background:var(--mark);border-radius:2px;padding:0 1px;color:#7c2d12}

  .app{display:flex;flex-direction:column;height:100vh}

  /* ---------- 顶栏 ---------- */
  .topbar{
    display:flex;align-items:center;gap:20px;
    padding:0 20px;height:64px;flex:0 0 64px;
    background:var(--panel);border-bottom:1px solid var(--line);
    position:relative;z-index:5;
  }
  .brand{display:flex;align-items:center;gap:10px;min-width:190px}
  .brand .logo{
    width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#2563eb,#4f8ef7);
    display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px;letter-spacing:-.5px;
  }
  .brand h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.2px}
  .brand p{margin:0;font-size:11px;color:var(--tx-3);line-height:1.2}

  .searchbox{flex:1;display:flex;align-items:center;gap:8px;
    background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);
    padding:0 12px;height:40px;max-width:760px;transition:.15s;
  }
  .searchbox:focus-within{border-color:#b9cdfb;background:#fff;box-shadow:0 0 0 3px var(--acc-soft)}
  .searchbox svg{flex:0 0 16px;color:var(--tx-3)}
  #q{flex:1;border:0;outline:0;background:none;height:100%;font-size:14.5px}
  #q::placeholder{color:var(--tx-3)}
  #clear{width:20px;height:20px;border-radius:50%;color:var(--tx-3);display:none;font-size:12px}
  #clear:hover{background:var(--line-2);color:var(--tx)}
  .kbd{font-size:11px;color:var(--tx-3);border:1px solid var(--line);border-radius:5px;
    padding:1px 5px;background:#fff;font-family:ui-monospace,Menlo,monospace}
  .topinfo{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--tx-3);white-space:nowrap}
  .topinfo b{color:var(--tx-2);font-weight:600}

  /* ---------- 主体 ---------- */
  .body{flex:1;display:grid;grid-template-columns:236px 1fr;min-height:0}

  aside.side{
    background:var(--panel);border-right:1px solid var(--line);
    overflow-y:auto;padding:14px 10px 24px;display:flex;flex-direction:column;gap:2px;
  }
  .side-sec{font-size:11px;color:var(--tx-3);letter-spacing:.08em;padding:14px 10px 6px;font-weight:600}
  .nav-item{
    display:flex;align-items:center;gap:8px;width:100%;text-align:left;
    padding:7px 10px;border-radius:8px;color:var(--tx-2);font-size:13.5px;
  }
  .nav-item:hover{background:var(--panel-2)}
  .nav-item.active{background:var(--acc-soft);color:var(--acc);font-weight:600}
  .nav-item .cnt{margin-left:auto;font-size:11.5px;color:var(--tx-3);font-variant-numeric:tabular-nums}
  .nav-item.active .cnt{color:var(--acc);opacity:.75}
  .nav-item .ic{width:15px;text-align:center;font-size:13px;opacity:.85}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:2px 8px}
  .chip{font-size:12px;padding:3px 9px;border:1px solid var(--line);border-radius:20px;
    color:var(--tx-2);background:#fff}
  .chip:hover{border-color:#c8d3e6}
  .chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
  #recents{list-style:none;margin:0;padding:0 4px}
  #recents li{padding:5px 8px;font-size:12.5px;color:var(--tx-2);border-radius:6px;cursor:pointer;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #recents li:hover{background:var(--panel-2);color:var(--acc)}
  .side-foot{margin-top:auto;padding:14px 10px 0;font-size:11px;color:var(--tx-3);line-height:1.9;border-top:1px solid var(--line-2)}

  main.main{display:grid;grid-template-columns:1fr;min-height:0;background:var(--bg)}
  main.main.has-reader{grid-template-columns:minmax(320px,42%) 1fr}

  /* ---------- 列表 ---------- */
  .listpane{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
  .listhead{
    display:flex;align-items:center;gap:10px;padding:10px 16px;flex:0 0 auto;
    border-bottom:1px solid var(--line-2);background:var(--panel);
    font-size:12.5px;color:var(--tx-3);
  }
  .listhead b{color:var(--tx);font-weight:600}
  .listhead select{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:7px;
    padding:3px 6px;font-size:12px;color:var(--tx-2);outline:none}
  .list{flex:1;overflow-y:auto;padding:8px 10px 40px}

  .filterbar{display:none;flex-wrap:wrap;gap:6px;align-items:center;
    padding:8px 16px;border-bottom:1px solid var(--line-2);background:#fbfcfe}
  .filterbar.on{display:flex}
  .filterbar .lb{font-size:11.5px;color:var(--tx-3);margin-right:2px}
  .fchip{display:inline-flex;align-items:center;gap:5px;font-size:12px;
    background:var(--acc-soft);color:#1d4ed8;border:1px solid #cfdcfb;border-radius:20px;
    padding:2px 3px 2px 10px;white-space:nowrap}
  .fchip button{width:16px;height:16px;border-radius:50%;color:#1d4ed8;font-size:11px;
    line-height:1;display:grid;place-items:center}
  .fchip button:hover{background:#dbe6fd}
  .fclearall{font-size:11.5px;color:var(--tx-3);padding:2px 6px;border-radius:6px}
  .fclearall:hover{background:var(--line-2);color:var(--tx)}

  .notice{margin:10px 14px 0;background:#fffbeb;border:1px solid #fde68a;color:#92400e;
    font-size:12.5px;padding:8px 12px;border-radius:8px;display:flex;gap:10px;align-items:center;line-height:1.5}
  .notice b{font-weight:600}
  .notice button{margin-left:auto;flex:0 0 auto;background:#fff;border:1px solid #fcd34d;
    color:#92400e;font-size:12px;padding:3px 10px;border-radius:6px;white-space:nowrap}
  .notice button:hover{background:#fffbeb}

  .card{
    display:block;width:100%;text-align:left;background:var(--panel);
    border:1px solid var(--line);border-radius:var(--r);
    padding:11px 13px;margin-bottom:8px;transition:.12s;
  }
  .card:hover{border-color:#cfd9ea;box-shadow:var(--shadow);transform:translateY(-1px)}
  .card.sel{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc-soft)}
  .card .t{font-size:14px;font-weight:600;line-height:1.45;margin-bottom:4px;color:var(--tx)}
  .card .snip{font-size:12.5px;color:var(--tx-2);line-height:1.6;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .m{display:flex;gap:8px;align-items:center;margin-top:7px;font-size:11.5px;color:var(--tx-3);flex-wrap:wrap}
  .pill{background:var(--acc-soft);color:#1d4ed8;border-radius:5px;padding:1px 6px;font-size:11px}
  .pill.src{background:#f1f3f6;color:var(--tx-2)}
  .star{color:#e0a800}
  .empty{padding:40px 20px;text-align:center;color:var(--tx-3);font-size:13px}

  /* ---------- 首页总览 ---------- */
  .home{flex:1;overflow-y:auto;padding:22px 24px 60px}
  .home h2{font-size:13px;color:var(--tx-3);font-weight:600;letter-spacing:.05em;margin:0 0 12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:28px}
  .cbox{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;
    text-align:left;transition:.12s}
  .cbox:hover{border-color:#cfd9ea;box-shadow:var(--shadow)}
  .cbox .n{font-size:13.5px;font-weight:600;margin-bottom:2px}
  .cbox .c{font-size:11.5px;color:var(--tx-3)}
  .recent{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .recent button{display:flex;width:100%;text-align:left;padding:9px 14px;gap:10px;align-items:center;
    border-bottom:1px solid var(--line-2);font-size:13px}
  .recent button:last-child{border-bottom:0}
  .recent button:hover{background:var(--panel-2)}
  .recent .dt{margin-left:auto;font-size:11.5px;color:var(--tx-3);flex:0 0 auto}

  /* ---------- 阅读区 ---------- */
  .reader{overflow-y:auto;background:var(--panel);display:none;min-height:0}
  main.has-reader .reader{display:block}
  .rd-head{position:sticky;top:0;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);padding:12px 26px 10px;z-index:2}
  .rd-t{font-size:18px;font-weight:700;line-height:1.4;margin:0 0 6px}
  .rd-m{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--tx-3);flex-wrap:wrap}
  .rd-m a{color:var(--acc);text-decoration:none}
  .rd-act{margin-left:auto;display:flex;gap:6px}
  .btn{font-size:12px;padding:4px 10px;border:1px solid var(--line);border-radius:7px;
    background:#fff;color:var(--tx-2)}
  .btn:hover{border-color:#c8d3e6;color:var(--tx)}
  .btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
  .rd-body{padding:18px 26px 80px;max-width:820px}
  .rd-tip{background:#f0f6ff;border:1px solid #d6e4ff;color:#1e40af;font-size:12.5px;
    padding:8px 12px;border-radius:8px;margin-bottom:14px}
  .rd-body h1{font-size:20px;margin:22px 0 10px}
  .rd-body h2{font-size:16.5px;margin:22px 0 8px;padding-left:9px;border-left:3px solid var(--acc)}
  .rd-body h3{font-size:14.5px;margin:16px 0 6px}
  .rd-body h4{font-size:13.5px;margin:14px 0 4px;color:var(--tx-2)}
  .rd-body p{margin:9px 0}
  .rd-body ul,.rd-body ol{margin:8px 0;padding-left:22px}
  .rd-body li{margin:3px 0}
  .rd-body code{background:#f2f4f7;border-radius:4px;padding:1px 5px;font-size:12.5px;
    font-family:ui-monospace,Menlo,Consolas,monospace;color:#b4295a}
  .rd-body pre{background:#f7f8fa;border:1px solid var(--line);border-radius:8px;padding:12px 14px;
    overflow-x:auto;font-size:12.5px;line-height:1.7}
  .rd-body pre code{background:none;padding:0;color:var(--tx)}
  .rd-body blockquote{margin:10px 0;padding:8px 14px;background:#f8f9fb;border-left:3px solid #d5dbe5;
    color:var(--tx-2);border-radius:0 6px 6px 0}
  .rd-body table{border-collapse:collapse;width:100%;margin:12px 0;font-size:13px}
  .rd-body th,.rd-body td{border:1px solid var(--line);padding:6px 10px;text-align:left}
  .rd-body th{background:var(--panel-2);font-weight:600}
  .rd-body hr{border:0;border-top:1px solid var(--line);margin:18px 0}
  .rd-body a{color:var(--acc)}
  .rd-body img{max-width:100%;height:auto;border:1px solid var(--line);border-radius:8px;
    margin:10px 0;background:#fff;display:block;cursor:zoom-in}
  .rd-body p:has(> img:only-child){margin:10px 0}
  .rd-empty{display:grid;place-items:center;height:100%;color:var(--tx-3);font-size:13px;text-align:center;padding:40px}

  .banner{background:#fffbeb;border:1px solid #fde68a;color:#92400e;font-size:12.5px;
    padding:8px 14px;border-radius:8px;margin:14px 20px}

  .lightbox{position:fixed;inset:0;background:rgba(15,23,42,.88);display:none;z-index:99;
    padding:24px;cursor:zoom-out}
  .lightbox.on{display:grid;place-items:center}
  .lightbox img{max-width:98%;max-height:94vh;border-radius:6px;box-shadow:0 20px 60px rgba(0,0,0,.5)}

  @media (max-width:1080px){
    .body{grid-template-columns:1fr}
    aside.side{display:none}
    main.main.has-reader{grid-template-columns:1fr}
    main.has-reader .listpane{display:none}
    .reader{position:fixed;inset:64px 0 0;z-index:4}
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo">KB</div>
      <div><h1>场地客服知识库</h1><p id="sub">本地检索 · 离线可用</p></div>
    </div>
    <div class="searchbox">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path>
      </svg>
      <input id="q" placeholder="描述客户的问题，比如：打印机不出小票 / 会员卡余额不对 / 退款流程" autocomplete="off" spellcheck="false">
      <button id="clear" title="清空">✕</button>
      <span class="kbd">/</span>
    </div>
    <div class="topinfo"><span id="stats"></span></div>
  </header>

  <div class="body">
    <aside class="side">
      <button class="nav-item active" id="navAll"><span class="ic">◈</span>全部知识<span class="cnt" id="cntAll"></span></button>
      <button class="nav-item" id="navFav"><span class="ic">★</span>常用收藏<span class="cnt" id="cntFav"></span></button>
      <div class="side-sec">分 类</div>
      <div id="cats"></div>
      <div class="side-sec">来 源</div>
      <div id="sources" class="chips"></div>
      <div class="side-sec">标 签</div>
      <div id="tags" class="chips"></div>
      <div class="side-sec">最近查看</div>
      <ul id="recents"></ul>
      <div class="side-foot">
        <div><b>/</b> 聚焦搜索 · <b>Esc</b> 清空</div>
        <div><b>↑ ↓</b> 切换结果 · <b>Enter</b> 打开</div>
      </div>
    </aside>

    <main class="main" id="main">
      <section class="listpane">
        <div class="listhead">
          <span id="resultInfo">全部知识</span>
          <select id="sort">
            <option value="relevance">按相关度</option>
            <option value="updated">按更新时间</option>
            <option value="title">按标题</option>
          </select>
        </div>
        <div id="filters" class="filterbar"></div>
        <div id="notice"></div>
        <div id="list" class="list"></div>
        <div id="home" class="home"></div>
      </section>
      <section class="reader" id="reader">
        <div class="rd-empty">在左侧选择一条知识，这里会显示完整内容</div>
      </section>
    </main>
  </div>
  <div id="lightbox" class="lightbox"><img alt=""></div>
</div>

<script src="data/index.js"></script>
<script>
(function(){
  const KB = window.KB;
  if(!KB || !KB.docs){
    document.body.innerHTML = '<div class="banner" style="margin:60px auto;max-width:560px">'+
      '还读不到索引文件 <code>data/index.js</code>。<br>请在 kb 目录执行：<br>'+
      '<b>python tools/build_index.py</b> 再刷新本页。</div>';
    return;
  }

  const $ = s => document.querySelector(s);
  const favKey='kb_favs', recKey='kb_rec';
  let favs = new Set(JSON.parse(localStorage.getItem(favKey)||'[]'));
  let recents = JSON.parse(localStorage.getItem(recKey)||'[]');

  const state = { q:'', cat:'', source:'', tag:'', onlyFav:false, sort:'relevance', sel:null, loose:false, relaxed:null };
  let list = [];

  const stripEmoji = s => (s||'').replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu,'').trim();

  // 疑问词 / 口水词，搜索前先剥掉，让口语化提问也能命中
  const STOP = ['怎么处理','如何处理','怎么办','怎么样','怎么弄','是什么原因','为什么','如何','是什么',
                '可不可以','能不能','可以吗','有没有','是不是','请问一下','请问','问一下','我想问',
                '客户说','客户反映','客人说','然后','这个','那个','一下','需要',
                '怎么','怎样','咋办','咋','啥','如何做','该',
                '吗','呢','呀','啊','吧'];

  // ---------- 预处理 ----------
  KB.docs.forEach(d=>{
    d.hay = (d.title+' '+(d.tags||[]).join(' ')+(d.aliases||[]).join(' ')+' '+d.category+' '+
             (d.section||'')+' '+(d.toc_path||'')+' '+d.content).toLowerCase();
    d.t = d.title.toLowerCase();
  });
  const CATS = KB.categories || [];
  const cnt = KB.cat_counts || {};
  const SYN = KB.synonyms || {};
  const PHRASES = (KB.phrases || []).slice().sort((a,b)=>b[0].length-a[0].length);
  const LEX = KB.lexicon || [];
  const LEXMAP = new Map();
  LEX.forEach(w=>{
    const k = w[0];
    if(!LEXMAP.has(k)) LEXMAP.set(k, []);
    LEXMAP.get(k).push(w);
  });

  // ---------- 工具 ----------
  const esc = s => (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  function terms(q){
    return q.trim().split(/[\s,，、;；\/]+/).filter(Boolean).map(t=>{
      const g = SYN[t] || SYN[t.toLowerCase()];
      return Array.from(new Set([t].concat(g||[]))).filter(Boolean);
    });
  }
  function countOcc(hay, w){ let n=0,i=0; while((i=hay.indexOf(w,i))!==-1){n++; i+=w.length} return n; }

  const TAIL = '的了吗呢吧呀啊嘛哦';
  function cleanQuery(q){
    let s = ' ' + q + ' ';
    // 1) 去掉疑问词/口水词
    STOP.slice().sort((a,b)=>b.length-a.length).forEach(w=>{ s = s.split(w).join(' '); });
    // 2) 口语 → 文档用词（钱少了→余额，权限不够→权限 …）
    for(const [from, to] of PHRASES){
      if(s.indexOf(from)!==-1) s = s.split(from).join(' ' + to + ' ');
    }
    // 3) 切词 + 去掉词尾语气词
    return s.split(/[\s,，、;；\/]+/).map(t=>t.trim())
      .filter(Boolean)
      .map(t=> (t.length>1 && TAIL.indexOf(t[t.length-1])!==-1) ? t.slice(0,-1) : t)
      .filter(t=>t.length>0);
  }

  // 用词表把长句切成词（只在整句搜不到时才用）
  function segment(text){
    const out = [];
    const hit = pos => {
      const bucket = LEXMAP.get(text[pos]);
      if(!bucket) return null;
      for(const w of bucket){ if(w.length>1 && text.startsWith(w,pos)) return w; }
      return null;
    };
    let i = 0;
    while(i < text.length){
      const m = hit(i);
      if(m){ out.push(m); i += m.length; continue; }
      let j = i + 1;
      while(j < text.length && !hit(j)) j++;
      const chunk = text.slice(i, j);
      if(chunk.length <= 2) out.push(chunk);
      else for(let k=0;k<chunk.length;k+=2) out.push(chunk.slice(k,k+2));
      i = j;
    }
    return out.filter(Boolean);
  }

  function scorePartial(d, groups){
    let matched=0, score=0, th=0;
    const bodyLower = d.content.toLowerCase();
    // 长度归一化：一两千字的正常文档不减分，上万字的"版本更新说明"类大文档要被压住
    const lenF = Math.min(1, Math.sqrt(1500 / Math.max(d.content.length || 0, 300)));
    for(const grp of groups){
      let best=0, hit=false, inTitle=false;
      for(const w of grp){
        const wl = w.toLowerCase();
        const inT = d.t.indexOf(wl)!==-1;
        const inTag = (d.tags||[]).some(t=>t.toLowerCase().indexOf(wl)!==-1) ||
                      (d.aliases||[]).some(t=>t.toLowerCase().indexOf(wl)!==-1);
        const inCat = d.category.toLowerCase().indexOf(wl)!==-1;
        const n = countOcc(bodyLower, wl);
        if(inT||inTag||inCat||n>0){
          hit = true;
          if(inT) inTitle = true;
          const s = (inT?26:0) + (inTag?14:0) + (inCat?8:0) + Math.min(n,8)*2*lenF;
          if(s>best) best = s;
        }
      }
      if(hit){ matched++; score += best; if(inTitle) th++; }
    }
    return {matched, score, th};
  }

  function scoreDoc(d, groups){
    const r = scorePartial(d, groups);
    if(!r.matched) return null;
    const need = groups.length<=2 ? groups.length : Math.ceil(groups.length*0.6);
    if(r.matched < need) return null;
    return {s: r.score + r.matched/groups.length*10 + (favs.has(d.id)? 6:0), th: r.th};
  }

  function makeSnippet(d, groups){
    // 纯截图文档：正文就是标题本身，别重复显示
    if((d.content||'').length < (d.title||'').length + 8){
      return '<span style="color:#9aa3af">以截图说明为主，无文字内容</span>';
    }
    const words = groups.flat().filter(w=>w.length>=1).sort((a,b)=>b.length-a.length);
    const low = d.content.toLowerCase();
    let idx=-1, hitWord='';
    for(const w of words){ const i = low.indexOf(w.toLowerCase()); if(i!==-1 && (idx===-1 || i<idx)){ idx=i; hitWord=w } }
    let text;
    if(idx===-1){ text = d.content.slice(0,110); }
    else{
      const from = Math.max(0, idx-46);
      text = (from>0?'…':'') + d.content.slice(from, from+150).trim() + '…';
    }
    let html = esc(text);
    for(const w of words){
      const re = new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
      html = html.replace(re, m=>'<mark>'+m+'</mark>');
    }
    return html;
  }

  // ---------- 检索 ----------
  function poolOf(useFilters){
    let pool = KB.docs;
    if(!useFilters) return pool;
    if(state.onlyFav) pool = pool.filter(d=>favs.has(d.id));
    if(state.cat) pool = pool.filter(d=>d.category===state.cat);
    if(state.source) pool = pool.filter(d=>d.source===state.source);
    if(state.tag) pool = pool.filter(d=>(d.tags||[]).indexOf(state.tag)!==-1);
    return pool;
  }

  function searchIn(pool, q){
    const words = cleanQuery(q);
    let groups = terms(words.length? words.join(' ') : q);
    const strict = gs => {
      const r = [];
      for(const d of pool){ const sc = scoreDoc(d, gs); if(sc) r.push({d, s:sc.s, th:sc.th}); }
      return r;
    };
    let out = strict(groups);
    let loose = false;

    // 兜底一：命中太少时，用词表把长词切开，按更细的词组再搜一次并合并
    if(out.length < 3){
      const seg = [];
      let changed = false;
      for(const w of words){
        if(w.length >= 4){
          const parts = segment(w);
          if(parts.length > 1){ seg.push(...parts); changed = true; continue; }
        }
        seg.push(w);
      }
      if(changed){
        const g2 = seg.map(t=>{ const g = terms(t); return g[0] || [t]; });
        const r2 = strict(g2);
        if(r2.length){
          const have = new Set(out.map(x=>x.d.id));
          out = out.concat(r2.filter(x=>!have.has(x.d.id)));
          groups = g2;
        }
      }
    }
    // 兜底二：没全部命中 → 按"命中了几个词"排序，把部分命中的补进来
    if(out.length < 3){
      const have = new Set(out.map(x=>x.d.id));
      const part = [];
      for(const d of pool){
        if(have.has(d.id)) continue;
        const r = scorePartial(d, groups);
        if(r.matched > 0) part.push({d, s: r.score * (r.matched/groups.length), m: r.matched, th: r.th});
      }
      part.sort((a,b)=> b.th-a.th || b.m-a.m || b.s-a.s);
      out = out.concat(part.slice(0, 30));
    }
    if(!out.length){            // 兜底二：拆成 2 字片段，按覆盖率+标题权重模糊匹配
      const grams = new Set();
      (words.length? words : [q]).forEach(t=>{
        if(t.length<=2) grams.add(t);
        else for(let i=0;i<t.length-1;i++) grams.add(t.slice(i,i+2));
      });
      const gg = [...grams].filter(Boolean).map(g=>{ const t = terms(g); return t[0] || [g]; });
      const tmp = [];
      if(gg.length){
        for(const d of pool){
          const r = scorePartial(d, gg);
          if(r.matched>0) tmp.push({d, s:r.score, cov:r.matched/gg.length});
        }
        out = tmp.filter(x=>x.cov>=0.34).sort((a,b)=>b.s-a.s||b.cov-a.cov).slice(0,12);
        if(out.length) loose = true;
      }
    }
    return {list: out, loose};
  }

  function activeFilterText(){
    return [
      state.cat && ('分类「'+state.cat+'」'),
      state.source && ('来源「'+state.source+'」'),
      state.tag && ('标签「'+state.tag+'」'),
      state.onlyFav && '只看收藏'
    ].filter(Boolean).join(' · ');
  }

  function run(){
    const q = state.q.trim();
    state.relaxed = null;

    if(!q){
      state.loose = false;
      list = poolOf(true).map(d=>({d, s:0}));
    } else {
      const filtered = poolOf(true);
      let r = searchIn(filtered, q);
      list = r.list; state.loose = r.loose;

      // 筛选状态下没结果 → 自动在全部知识里再搜一次，别让用户对着空页发呆
      const all = poolOf(false);
      if(!list.length && filtered.length < all.length){
        const r2 = searchIn(all, q);
        if(r2.list.length){
          list = r2.list; state.loose = r2.loose;
          state.relaxed = activeFilterText();
        }
      }
    }
    if(state.sort==='updated') list.sort((a,b)=>(b.d.updated||'').localeCompare(a.d.updated||''));
    else if(state.sort==='title'){
      const key = t => t.replace(/^[^\u4e00-\u9fa5a-zA-Z0-9]+/, '');
      list.sort((a,b)=>key(a.d.title).localeCompare(key(b.d.title),'zh'));
    }
    else if(q) list.sort((a,b)=> (b.th||0)-(a.th||0) || b.s-a.s);
    else list.sort((a,b)=>(b.d.updated||'').localeCompare(a.d.updated||''));
    render();
  }

        '<button class="fclearall" data-clearf="all">全部清除</button>';

    $('#notice').innerHTML = state.relaxed
      ? '<div class="notice"><span>当前筛选（'+esc(state.relaxed)+'）下没有匹配，已自动在<b>全部 '+
        KB.docs.length+' 篇</b>里搜索。</span><button data-clearf="all">清除筛选</button></div>'
      : '';

    // 列表 / 首页
    const showHome = !q && !state.cat && !state.source && !state.onlyFav && !state.sel && !state.tag;
    $('#home').style.display = showHome? 'block':'none';
    $('#list').style.display = showHome? 'none':'block';
    $('#resultInfo').innerHTML = showHome? '全部知识'
      : ('<b>'+list.length+'</b> 条' + (state.loose?'相近':'') + '结果' + (q?' · “'+esc(q)+'”':'') +
         (!state.relaxed && state.cat?' · '+esc(state.cat):'') +
         (!state.relaxed && state.tag?' · #'+esc(state.tag):'') +
         (state.relaxed?' · 全部知识':''));

    if(showHome){ renderHome(); }
    else if(!list.length){
      $('#list').innerHTML = '<div class="empty">没有匹配的知识。<br><br>试着换个说法，或减少关键词。<br>'+
        '也可以点左侧分类浏览。</div>';
    } else {
      $('#list').innerHTML = list.map((it,i)=>{
        const d = it.d;
        const snip = q? makeSnippet(d, groups) : esc(d.summary);
        return '<button class="card'+(state.sel===d.id?' sel':'')+'" data-id="'+esc(d.id)+'" data-i="'+i+'"'+
          (d.toc_path?' title="'+esc(d.toc_path)+'"':'')+'>'+
          '<div class="t">'+(favs.has(d.id)?'<span class="star">★ </span>':'')+esc(d.title)+'</div>'+
          '<div class="snip">'+snip+'</div>'+

          (d.section?'<span style="color:#8b94a1">'+
             esc(stripEmoji(d.toc_path? d.toc_path.split(' / ').slice(-2).join(' › ') : d.section))+'</span>':'')+
          (d.tags||[]).slice(0,2).map(t=>'<span data-tag="'+esc(t)+'" style="cursor:pointer">#'+esc(t)+'</span>').join('')+
          (d.updated?'<span style="margin-left:auto">'+esc(d.updated)+'</span>':'')+
          '</div></button>';
      }).join('');
    }
  }

  function renderHome(){
    const cards = CATS.filter(c=>cnt[c]).map(c=>
      '<button class="cbox" data-cat="'+esc(c)+'"><div class="n">'+esc(c)+'</div><div class="c">'+cnt[c]+' 篇</div></button>'
    ).join('');
    const recent = KB.docs.slice().sort((a,b)=>(b.updated||'').localeCompare(a.updated||'')).slice(0,8);
    $('#home').innerHTML =
      '<h2>按业务板块浏览</h2><div class="grid">'+cards+'</div>'+
      '<h2>最近更新</h2><div class="recent">'+recent.map(d=>
        '<button data-open="'+esc(d.id)+'"><span class="pill">'+esc(d.category)+'</span>'+
        '<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(d.title)+'</span>'+
        '<span class="dt">'+esc(d.updated||'')+'</span></button>').join('')+'</div>';
  }

  // ---------- Markdown 渲染 ----------
  function md(src){
    const lines = (src||'').split(/\r?\n/);
    let out='', i=0, inUl=false, inOl=false;
    const closeList = ()=>{ if(inUl){out+='</ul>';inUl=false} if(inOl){out+='</ol>';inOl=false} };
    const inline = t => {
      const keep=[];
      let s = String(t||'').replace(/<(script|style)[\s\S]*?<\/\1>/gi,'');
      s = s.replace(/<br\s*\/?>/gi,'\u0001BR\u0001');
      s = s.replace(/<img[^>]*src=["']([^"']+)["'][^>]*>/gi,(m,u)=>{
        keep.push('<img src="'+u+'" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display=\'none\'">'); return '\u0001K'+(keep.length-1)+'\u0001';
      });
      s = s.replace(/<font[^>]*color=["']?([^"'>\s]+)["']?[^>]*>/gi,(m,c)=>{
        keep.push('<span style="color:'+c+'">'); return '\u0001K'+(keep.length-1)+'\u0001';
      });
      s = s.replace(/<\/font>/gi,'\u0001E\u0001');
      s = s.replace(/<\/?[a-zA-Z][^>]*>/g,'');
      s = esc(s)
        .replace(/`([^`]+)`/g,'<code>$1</code>')
        .replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g,(m,alt,u)=>'<img src="'+u+'" alt="'+alt+'" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display=\'none\'">')
        .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
        .replace(/(^|\s)\*([^*\n]+)\*/g,'$1<em>$2</em>')
        .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
      return s.replace(/\u0001K(\d+)\u0001/g,(m,i)=>keep[+i]||'')
              .replace(/\u0001E\u0001/g,'</span>')
              .replace(/\u0001BR\u0001/g,'<br>');
    };

    while(i<lines.length){
      let ln = lines[i];
      if(/^\s*```/.test(ln)){
        const lang = ln.replace(/^\s*```/,'').trim();
        const buf=[]; i++;
        while(i<lines.length && !/^\s*```/.test(lines[i])){ buf.push(lines[i]); i++; }
        i++; closeList();
        out += '<pre><code>'+esc(buf.join('\n'))+'</code></pre>';
        continue;
      }
      if(/^\s*$/.test(ln)){ closeList(); i++; continue; }
      const h = ln.match(/^\s{0,3}(#{1,6})\s+(.*)$/);
      if(h){ closeList(); const lv=Math.min(h[1].length,4);
        out += '<h'+lv+'>'+inline(h[2])+'</h'+lv+'>'; i++; continue; }
      if(/^\s*([-*_])\1{2,}\s*$/.test(ln)){ closeList(); out+='<hr>'; i++; continue; }
      if(/^\s*>/.test(ln)){
        closeList(); const buf=[];
        while(i<lines.length && /^\s*>/.test(lines[i])){ buf.push(lines[i].replace(/^\s*>\s?/,'')); i++; }
        out += '<blockquote>'+inline(buf.join(' '))+'</blockquote>';
        continue;
      }
      // 表格
      if(/^\s*\|/.test(ln) && i+1<lines.length && /^\s*\|[\s:|-]+\|?\s*$/.test(lines[i+1])){
        closeList();
        const cells = r => r.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(c=>c.trim());
        const head = cells(ln); i+=2;
        let html='<table><thead><tr>'+head.map(c=>'<th>'+inline(c)+'</th>').join('')+'</tr></thead><tbody>';
        while(i<lines.length && /^\s*\|/.test(lines[i])){
          html += '<tr>'+cells(lines[i]).map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>'; i++;
        }
        out += html+'</tbody></table>';
        continue;
      }
      const ul = ln.match(/^\s*[-*+]\s+(.*)$/);
      const ol = ln.match(/^\s*\d+[.)]\s+(.*)$/);
      if(ul){ if(inOl){out+='</ol>';inOl=false} if(!inUl){out+='<ul>';inUl=true} out+='<li>'+inline(ul[1])+'</li>'; i++; continue; }
      if(ol){ if(inUl){out+='</ul>';inUl=false} if(!inOl){out+='<ol>';inOl=true} out+='<li>'+inline(ol[1])+'</li>'; i++; continue; }
      closeList();
      const buf=[ln];
      i++;
      while(i<lines.length && !/^\s*$/.test(lines[i]) && !/^\s{0,3}#{1,6}\s/.test(lines[i])
            && !/^\s*[-*+]\s/.test(lines[i]) && !/^\s*\d+[.)]\s/.test(lines[i])
            && !/^\s*\|/.test(lines[i]) && !/^\s*```/.test(lines[i]) && !/^\s*>/.test(lines[i])){
        buf.push(lines[i]); i++;
      }
      out += '<p>'+inline(buf.join(' '))+'</p>';
    }
    closeList();
    return out;
  }

  // ---------- 打开文档 ----------
  function open(id){
    const d = KB.docs.find(x=>x.id===id);
    if(!d) return;
    state.sel = id;
    $('#main').classList.add('has-reader');
    recents = [id].concat(recents.filter(x=>x!==id)).slice(0,20);
    localStorage.setItem(recKey, JSON.stringify(recents));
    $('#reader').innerHTML =
      '<div class="rd-head"><div class="rd-t">'+esc(d.title)+'</div>'+
      '<div class="rd-m"><span class="pill">'+esc(d.category)+'</span>'+
        (d.source?'<span>来源：'+esc(d.source)+'</span>':'')+
        (d.updated?'<span>更新：'+esc(d.updated)+'</span>':'')+
        (d.toc_path?'<span style="color:#9aa3af;font-size:11.5px">📁 '+esc(d.toc_path)+'</span>':'')+
        (d.url?'<a href="'+esc(d.url)+'" target="_blank" rel="noopener">打开原文 ↗</a>':'')+
        '<div class="rd-act">'+
          '<button class="btn" id="btnFav">'+(favs.has(d.id)?'已收藏 ★':'收藏 ☆')+'</button>'+
          '<button class="btn primary" id="btnCopy">复制正文</button>'+
        '</div></div>'+
        (d.tags&&d.tags.length?'<div class="rd-m" style="margin-top:6px">'+d.tags.map(t=>'<span>#'+esc(t)+'</span>').join(' ')+'</div>':'')+
      '</div>'+
      '<div class="rd-body">'+
        (((d.content||'').trim().length < 40 && (d.md||'').indexOf('![')!==-1)
          ? '<div class="rd-tip">本文档以截图说明为主，没有文字描述，图片可点击放大。</div>' : '')+
        md(d.md || d.content)+'</div>';

    $('#reader').scrollTop = 0;
    $('#btnCopy').onclick = async ()=>{
      try{ await navigator.clipboard.writeText(d.title+'\n\n'+(d.md||d.content));
        $('#btnCopy').textContent='已复制 ✓'; setTimeout(()=>$('#btnCopy').textContent='复制正文',1400);
      }catch(e){ alert('复制失败，请手动选中正文复制。'); }
    };
    $('#btnFav').onclick = ()=>{
      if(favs.has(d.id)) favs.delete(d.id); else favs.add(d.id);
      localStorage.setItem(favKey, JSON.stringify([...favs]));
      open(id); render();
    };
    render();
    const card = document.querySelector('.card.sel');
    if(card) card.scrollIntoView({block:'nearest'});
  }

  // ---------- 事件 ----------
  let timer=null;
  $('#q').addEventListener('input', e=>{
    clearTimeout(timer);
    const v = e.target.value;
    timer = setTimeout(()=>{ state.q=v; state.sel=null; run(); }, 90);
  });
  $('#q').addEventListener('keydown', e=>{
    if(e.key==='Escape'){ e.target.value=''; state.q=''; state.sel=null; $('#main').classList.remove('has-reader'); run(); }
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){
      e.preventDefault();
      if(!list.length) return;
      const idx = list.findIndex(x=>x.d.id===state.sel);
      let n = e.key==='ArrowDown'? idx+1 : (idx===-1? 0 : idx-1);
      n = Math.max(0, Math.min(list.length-1, n));
      state.sel = list[n].d.id;
      open(state.sel);
      const c = document.querySelector('.card.sel'); if(c) c.scrollIntoView({block:'nearest'});
    }
    if(e.key==='Enter'){
      const first = document.querySelector('.card');
      if(first) open(first.dataset.id);
    }
  });
  $('#clear').onclick = ()=>{ $('#q').value=''; state.q=''; state.sel=null; $('#main').classList.remove('has-reader'); run(); $('#q').focus(); };
  $('#sort').onchange = e=>{ state.sort=e.target.value; run(); };
  $('#navAll').onclick = ()=>{ state.cat=''; state.source=''; state.tag=''; state.onlyFav=false; state.sel=null; $('#main').classList.remove('has-reader'); run(); };
  $('#navFav').onclick = ()=>{ state.onlyFav=!state.onlyFav; state.cat=''; state.source=''; state.sel=null; run(); };

  document.addEventListener('click', e=>{
    const cat = e.target.closest('[data-cat]');
    if(cat){ state.cat = (state.cat===cat.dataset.cat? '' : cat.dataset.cat); state.onlyFav=false; state.sel=null; run(); return; }
    const src = e.target.closest('[data-src]');
    if(src){ state.source = (state.source===src.dataset.src? '' : src.dataset.src); state.sel=null; run(); return; }
    const tg = e.target.closest('[data-tag]');
    if(tg){ state.tag = (state.tag===tg.dataset.tag? '' : tg.dataset.tag); state.sel=null; run(); return; }
    const cf = e.target.closest('[data-clearf]');
    if(cf){
      const k = cf.dataset.clearf;
      if(k==='all'||k==='cat') state.cat='';
      if(k==='all'||k==='src') state.source='';
      if(k==='all'||k==='tag') state.tag='';
      if(k==='all'||k==='fav') state.onlyFav=false;
      state.sel=null; run(); return;
    }
    const openBtn = e.target.closest('[data-open]');
    if(openBtn){ open(openBtn.dataset.open); return; }
    const card = e.target.closest('.card');
    if(card){ open(card.dataset.id); return; }
  });

  $('#reader').addEventListener('click', e=>{
    if(e.target.tagName==='IMG' && e.target.closest('.rd-body')){
      const lb = $('#lightbox');
      lb.querySelector('img').src = e.target.src;
      lb.classList.add('on');
    }
  });
  $('#lightbox').onclick = ()=> $('#lightbox').classList.remove('on');

  document.addEventListener('keydown', e=>{
    if(e.key==='/' && document.activeElement!==$('#q')){
      e.preventDefault(); $('#q').focus(); $('#q').select();
    }
    if(e.key==='Escape'){
      if($('#lightbox').classList.contains('on')){ $('#lightbox').classList.remove('on'); return; }
      if(document.activeElement!==$('#q')){
        $('#main').classList.remove('has-reader'); state.sel=null; render();
      }
    }
  });

  // 调试：控制台可查某个词的实际打分排序
  window.__kbSearch = q => searchIn(KB.docs, q).list
    .sort((a,b)=>b.s-a.s).slice(0,10).map(x=>Math.round(x.s)+'  '+x.d.title);
  window.__kbDebug = q => {
    const w = cleanQuery(q);
    return {words: w, groups: terms(w.join(' ')),
      top: searchIn(KB.docs, q).list.sort((a,b)=>(b.th||0)-(a.th||0)||b.s-a.s).slice(0,6)
        .map(x=>[Math.round(x.s), x.th||0, x.d.title])};
  };

  run();
})();
</script>
</body>
</html>
